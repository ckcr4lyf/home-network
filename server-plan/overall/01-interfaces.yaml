network:
  version: 2
  renderer: networkd
  ethernets:
    enp5s0f0:
      addresses: [192.168.30.1/24]
      dhcp4: no
      routes:
        # Allows me to connect to devices on the .30.0/24 network directly (not try and use wg2 as the gateway)
        - to: 192.168.30.0/24
          via: 192.168.30.1
          metric: 10
          table: 69
      routing-policy:
        - from: 192.168.30.0/24
          table: 69
          priority: 70
      optional: true
    enp5s0f1:
      addresses: [192.168.60.1/24]
      dhcp4: no